name: Terraform Init Cache Setup
description: This action sets up terraform and a cache for Terraform init to speed up subsequent runs.

inputs:
  terraform_version:
    description: 'The version of Terraform to use'
    required: true
  working_directory:
    description: 'The working directory for Terraform init'
    required: true
  TF_PLUGIN_CACHE_DIR:
    description: 'The directory to cache Terraform providers'
    required: false
    default: ${{ github.workspace }}/.terraform.d/plugin-cache

runs:
  using: "composite"
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform_version }}
        terraform_wrapper: false
    
    - name: create provider cache directory
      shell: bash
      run: |
        mkdir -p "${{inputs.TF_PLUGIN_CACHE_DIR}}"
   
    - name: Check terraform Provider
      uses: actions/cache@v6.1.0
      with:
        path: ${{ inputs.TF_PLUGIN_CACHE_DIR }}
        key: terraform-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', inputs.working_directory)) }}

    - name: Check Azure authentication variables
      shell: bash
      run: |
        required_vars=(
        STATE_RESOURCE_GROUP_NAME
        STATE_STORAGE_ACCOUNT
        STATE_CONTAINER
        STATE_KEY
        )

        for name in "${required_vars[@]}"; do
        if [[ -z "${!name}" ]]; then
          echo "::error::Required variable '$name' is missing or empty."
          exit 1
        fi
        done

        echo "All required backend variables are available."
    
    - name: Terraform init
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        TF_PLUGIN_CACHE_DIR: ${{ inputs.TF_PLUGIN_CACHE_DIR }}
      run: |
        terraform init -input=false \
        -backend-config="resource_group_name=$STATE_RESOURCE_GROUP_NAME" \
          -backend-config="storage_account_name=$STATE_STORAGE_ACCOUNT" \
          -backend-config="container_name=$STATE_CONTAINER" \
          -backend-config="key=$STATE_KEY"
  